[workspace]
resolver = "3"
members = ["keepass", "keepass-platform"]
# Both members are the default, so a bare `cargo build` or `cargo test` at the
# root reaches every shippable crate without `--workspace`.
default-members = ["keepass", "keepass-platform"]

[workspace.package]
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/neotales/rs-keepass"
authors = ["x0craft"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
