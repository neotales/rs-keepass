[package]
name = "neotales-keepass"
description = "Headless, bounded KeePass KDBX document and wire codec"
version = "0.0.0-alpha.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["keepass", "kdbx", "password-manager", "security"]
categories = ["cryptography", "parser-implementations"]

[dependencies]
aes = "0.9.2"
argon2 = "0.6.0"
base64 = "0.22"
cbc = { version = "0.2.1", features = ["alloc", "block-padding"] }
# KDBX needs the cipher to zeroize on drop, so the extra is declared here rather
# than left to a caller that might not enable it.
chacha20 = { version = "0.10.2", features = ["cipher", "legacy", "xchacha", "zeroize"] }
# The 0.11 digest line, matching `neotales-crypto` and `neotales-x509`. `sha2`
# below is 0.11 for the same reason.
digest = "0.11.3"
flate2 = "1.1"
getrandom = "0.3"
hmac = "0.13.0"
quick-xml = "0.42"
sha1 = "0.11.0"
sha2 = "0.11"
salsa20 = "0.11"
thiserror = "2.0"
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }
zeroize = { version = "=1.9.0", features = ["derive"] }

[dev-dependencies]
tempfile = "3.24"

[lints]
workspace = true

[workspace]
resolver = "3"
members = [".", "keepass-platform"]

[workspace.package]
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/neotales/rs-keepass"
authors = ["x0craft"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
