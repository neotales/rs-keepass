name: ci

# One repository, a virtual workspace with two crates: `keepass/` is
# `neotales-keepass` and `keepass-platform/` is `neotales-keepass-platform`.
# Both are shippable, so every cargo command that formats, lints, tests or
# documents them passes `--workspace`. `default-members` is a convenience for a
# developer's bare `cargo test`; a later edit to it must not be able to hide a
# crate from CI. `--all-targets` does not run doctests, so each job that runs
# tests runs a `--doc` pass as well.
#
# The `--all-features` flags enable both crates' features at once, including
# `keepass-platform`'s off-by-default `windows-dpapi` and `memory-pin`.

on:
  push:
    # Every branch, not only the default one: a branch filter hides a failure
    # until the work lands. No path filter either, because a change to a README
    # can still be the change that breaks the build.
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ci

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets --all-features

      # Separate from the test step above, because `--all-targets` selects the
      # unit, integration, example and benchmark targets and not doctests.
      - name: Doctests
        run: cargo test --workspace --doc --all-features

      - name: Documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --all-features --no-deps

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs 1.100.0, the channel in rust-toolchain.toml and the minimum
      # supported version declared in each member's Cargo.toml. Do not float to
      # stable here: a job named msrv that tests stable proves nothing.
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: msrv

      # Every workspace member must declare the same minimum, not just the
      # first package cargo happens to list.
      - name: Check the declared minimum Rust version
        run: |
          cargo metadata --no-deps --format-version 1 > metadata.json
          python3 - <<'PY'
          import json
          import sys

          with open("metadata.json", encoding="utf-8") as handle:
              packages = json.load(handle)["packages"]

          if not packages:
              sys.exit("cargo metadata listed no packages")

          failed = False
          for package in packages:
              declared = package.get("rust_version") or ""
              print(f"{package['name']}: rust-version {declared or '<unset>'}")
              if declared != "1.100":
                  print(
                      f"::error::{package['name']} must declare "
                      f'rust-version = "1.100", found {declared or "<unset>"}.'
                  )
                  failed = True
          sys.exit(1 if failed else 0)
          PY

      - name: Test on the minimum supported Rust version
        run: cargo test --workspace --all-targets --all-features

      # The same split as the matrix job: `--all-targets` does not include
      # doctests, and a doctest that uses a newer API breaks the declared
      # minimum just as a unit test does.
      - name: Doctests on the minimum supported Rust version
        run: cargo test --workspace --doc --all-features
